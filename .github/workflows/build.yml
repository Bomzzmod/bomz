name: Build Flutter APK

on:
  workflow_dispatch:
    inputs:
      zip_url:
        description: "URL download ZIP project Flutter"
        required: true

      tag:
        description: "Tag build"
        required: true

      build_type:
        description: "debug / release"
        required: true
        default: "release"
        
      only_analyze:
        description: "Hanya jalankan analyze (true/false)"
        required: false
        default: "false"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
    
    steps:

      # =========================
      # NODE.JS
      # =========================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      # =========================
      # DOWNLOAD ZIP
      # =========================
      - name: Download ZIP project
        run: |
          echo "=== Downloading ZIP ==="
          echo "URL: ${{ github.event.inputs.zip_url }}"

          curl -L \
            -H "Authorization: Bearer ${{ secrets.PAT_TOKEN }}" \
            -H "Accept: application/octet-stream" \
            "${{ github.event.inputs.zip_url }}" \
            -o project.zip \
            -w "\n=== HTTP Status: %{http_code} ===\n=== Final URL: %{url_effective} ===\n"

          echo ""
          echo "=== File Info ==="
          ls -lh project.zip

          echo ""
          echo "=== File Type ==="
          file project.zip

          echo ""
          echo "=== First Bytes ==="
          xxd project.zip | head -2

      # =========================
      # EXTRACT ZIP
      # =========================
      - name: Extract ZIP
        run: |
          echo "=== Validating ZIP ==="

          if ! unzip -t project.zip > /dev/null 2>&1; then
            echo "❌ File bukan ZIP valid!"
            echo ""
            echo "=== Isi file ==="
            cat project.zip
            exit 1
          fi

          echo "✅ ZIP valid"

          echo ""
          echo "=== Extracting ZIP ==="
          unzip -q project.zip -d project_raw

          echo ""
          echo "=== Isi folder project_raw (depth 3) ==="
          find project_raw -maxdepth 3 | head -80

          echo ""
          echo "=== Deteksi PROJECT_DIR (loop, handle nested folder) ==="

          DETECT_DIR="project_raw"

          for i in 1 2 3 4 5; do
            echo "  [level $i] cek: $DETECT_DIR"

            if [ -f "$DETECT_DIR/pubspec.yaml" ] || \
               [ -f "$DETECT_DIR/settings.gradle" ] || \
               [ -f "$DETECT_DIR/settings.gradle.kts" ] || \
               [ -f "$DETECT_DIR/build.gradle" ] || \
               [ -f "$DETECT_DIR/build.gradle.kts" ] || \
               [ -f "$DETECT_DIR/android/settings.gradle" ] || \
               [ -f "$DETECT_DIR/android/settings.gradle.kts" ]; then
              echo "  ✅ Marker project ditemukan di: $DETECT_DIR"
              break
            fi

            SUB_DIR_COUNT=$(find "$DETECT_DIR" -maxdepth 1 -mindepth 1 -type d | wc -l)
            FILE_COUNT=$(find "$DETECT_DIR" -maxdepth 1 -mindepth 1 -type f | wc -l)

            if [ "$SUB_DIR_COUNT" -eq 1 ] && [ "$FILE_COUNT" -eq 0 ]; then
              DETECT_DIR=$(find "$DETECT_DIR" -maxdepth 1 -mindepth 1 -type d | head -n 1)
              continue
            fi

            echo "  ℹ️ Tidak bisa turun lebih dalam, berhenti di: $DETECT_DIR"
            break
          done

          PROJECT_DIR="$DETECT_DIR"
          echo "✅ Project root final: $PROJECT_DIR"
          echo "PROJECT_DIR=$PROJECT_DIR" >> $GITHUB_ENV

      # =========================
      # JAVA
      # =========================
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # =========================
      # FLUTTER
      # =========================
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.41.9"
          channel: "stable"
          cache: true

      # ==========================================================
      # 🛠️ FIX FLUTTER SDK PATH (AGGRESSIVE + SPACE-SAFE)
      # ==========================================================
      - name: Normalize Flutter SDK path
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Normalizing Flutter SDK path (aggressive + space-safe) ==="
          echo "Runner OS: $RUNNER_OS"
          echo "Flutter SDK: $FLUTTER_ROOT"
          echo "Working dir: $(pwd)"

          # ---------- 1) Sanitize android/local.properties ----------
          LOCAL_PROPS="android/local.properties"
          if [ -f "$LOCAL_PROPS" ]; then
            echo "📄 Found $LOCAL_PROPS"
            grep -vE '^[[:space:]]*flutter\.sdk[[:space:]]*=' "$LOCAL_PROPS" > "$LOCAL_PROPS.tmp" || true
            mv "$LOCAL_PROPS.tmp" "$LOCAL_PROPS"
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" >> "$LOCAL_PROPS"
            echo "✅ flutter.sdk diperbarui."
          else
            echo "ℹ️ android/local.properties tidak ditemukan, membuat file baru."
            mkdir -p android
            printf 'flutter.sdk=%s\n' "$FLUTTER_ROOT" > "$LOCAL_PROPS"
          fi

          # ---------- 2) Buang cache build lama ----------
          echo ""
          echo "=== Membersihkan cache/folder build lama dari ZIP ==="
          rm -rf android/.gradle android/build android/app/build build .dart_tool 2>/dev/null || true
          find . -type d -name ".gradle" -prune -exec rm -rf {} + 2>/dev/null || true
          find . -type d -name "build" -prune -exec rm -rf {} + 2>/dev/null || true
          echo "✅ Cache lama dibersihkan."

          # ---------- 3) Scan file yang mengandung path Windows ----------
          echo ""
          echo "=== Memindai path Windows hardcoded di seluruh project ==="

          mapfile -t FILES_TO_FIX < <(grep -RIlE '[A-Za-z]:[\\/]+flutter' \
            --include="*.gradle" \
            --include="*.properties" \
            --include="*.kts" \
            --include="*.xml" \
            --include="*.json" \
            --include="*.yaml" \
            --include="*.yml" \
            . 2>/dev/null || true)

          CLEAN_FILES=()
          for f in "${FILES_TO_FIX[@]}"; do
            [ -n "$f" ] && CLEAN_FILES+=("$f")
          done

          if [ "${#CLEAN_FILES[@]}" -eq 0 ]; then
            echo "✅ Tidak ada path Windows Flutter di file konfigurasi."
          else
            echo "📄 File yang akan diperbaiki: ${#CLEAN_FILES[@]}"
            printf '   - %s\n' "${CLEAN_FILES[@]}"

            for f in "${CLEAN_FILES[@]}"; do
              echo "  🔧 Fix: $f"
              sed -i -E "s#([A-Za-z]:[\\\\/]+flutter)#${FLUTTER_ROOT}#g" "$f"
            done
            echo "✅ Selesai memperbaiki file."
          fi

          # ---------- 4) Verifikasi ----------
          echo ""
          echo "=== Verifikasi akhir: cek sisa path Windows ==="
          mapfile -t REMAINING < <(grep -RInE '[A-Za-z]:[\\/]+flutter' \
            --include="*.gradle" \
            --include="*.properties" \
            --include="*.kts" \
            . 2>/dev/null || true)

          if [ "${#REMAINING[@]}" -gt 0 ] && [ -n "${REMAINING[0]}" ]; then
            echo "⚠️ Masih ada referensi Windows:"
            printf '%s\n' "${REMAINING[@]}"
            echo "Mencoba fix paksa..."
            mapfile -t REMAINING_FILES < <(printf '%s\n' "${REMAINING[@]}" | cut -d: -f1 | sort -u)
            for f in "${REMAINING_FILES[@]}"; do
              [ -z "$f" ] && continue
              [ -f "$f" ] || continue
              echo "  🔧 Paksa fix: $f"
              sed -i -E "s#([A-Za-z]:[\\\\/]+flutter)#${FLUTTER_ROOT}#g" "$f"
            done
          else
            echo "✅ Bersih. Tidak ada path Windows tersisa."
          fi

          echo ""
          echo "=== Spot check android/settings.gradle ==="
          if [ -f "android/settings.gradle" ]; then
            grep -nE "flutter|includeBuild|pluginManagement" android/settings.gradle | head -20
          fi

          echo ""
          echo "=== Spot check android/local.properties ==="
          if [ -f "android/local.properties" ]; then
            cat android/local.properties
          fi

      # ==========================================================
      # 🧠 FIX GRADLE MEMORY & WRAPPER
      # ==========================================================
      - name: Fix Gradle Memory & Wrapper
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Fixing Gradle memory & wrapper ==="

          if [ ! -d "android" ]; then
            echo "ℹ️ Folder android/ tidak ditemukan. Skip."
            exit 0
          fi

          GRADLE_PROPS="android/gradle.properties"

          if [ -f "$GRADLE_PROPS" ]; then
            grep -vE '^[[:space:]]*org\.gradle\.jvmargs[[:space:]]*=' "$GRADLE_PROPS" > "$GRADLE_PROPS.tmp" || true
            mv "$GRADLE_PROPS.tmp" "$GRADLE_PROPS"
          else
            touch "$GRADLE_PROPS"
          fi

          cat >> "$GRADLE_PROPS" << 'EOF'
          org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8
          org.gradle.daemon=false
          org.gradle.parallel=true
          org.gradle.caching=true
          android.useAndroidX=true
          android.enableJetifier=true
          EOF

          echo "✅ gradle.properties diperbarui:"
          cat "$GRADLE_PROPS"

          if [ -f "android/gradlew" ]; then
            echo ""
            echo "=== Forcing Gradle wrapper to 8.9 ==="
            cd android
            chmod +x gradlew
            ./gradlew wrapper --gradle-version 8.9 --distribution-type bin || {
              echo "⚠️ Gagal update wrapper, lanjut dengan wrapper yang ada."
            }
            cd ..
          fi

          echo "✅ Selesai."

      # ==========================================================
      # 🔧 UPGRADE compileSdk KE 36
      # ==========================================================
      # Plugin package_info_plus, path_provider_android, dll. butuh
      # compileSdk 36. Flutter akan print warning tapi tetap lanjut;
      # step ini menghilangkan warning + memastikan kompatibilitas.
      # ==========================================================
      - name: Upgrade compileSdk to 36
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Upgrading compileSdk to 36 ==="

          APP_GRADLE=""
          if [ -f "android/app/build.gradle.kts" ]; then
            APP_GRADLE="android/app/build.gradle.kts"
          elif [ -f "android/app/build.gradle" ]; then
            APP_GRADLE="android/app/build.gradle"
          fi

          if [ -z "$APP_GRADLE" ]; then
            echo "ℹ️ File android/app/build.gradle(.kts) tidak ditemukan. Skip."
            exit 0
          fi

          echo "📄 Fixing: $APP_GRADLE"
          echo ""
          echo "=== Sebelum ==="
          grep -nE "compileSdk" "$APP_GRADLE" || echo "(tidak ada baris compileSdk)"

          if [[ "$APP_GRADLE" == *.kts ]]; then
            # Kotlin DSL
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*[0-9]+/compileSdk = 36/' "$APP_GRADLE"
            sed -i -E 's/compileSdkVersion[[:space:]]*=[[:space:]]*[0-9]+/compileSdkVersion = 36/' "$APP_GRADLE"
            # Handle kalau pakai flutter.compileSdkVersion
            sed -i -E 's/compileSdk[[:space:]]*=[[:space:]]*flutter\.compileSdkVersion/compileSdk = 36/' "$APP_GRADLE"
          else
            # Groovy DSL
            sed -i -E 's/compileSdk[[:space:]]+[0-9]+/compileSdk 36/' "$APP_GRADLE"
            sed -i -E 's/compileSdkVersion[[:space:]]+[0-9]+/compileSdkVersion 36/' "$APP_GRADLE"
            sed -i -E 's/compileSdk[[:space:]]+flutter\.compileSdkVersion/compileSdk 36/' "$APP_GRADLE"
            sed -i -E 's/compileSdkVersion[[:space:]]+flutter\.compileSdkVersion/compileSdkVersion 36/' "$APP_GRADLE"
          fi

          echo ""
          echo "=== Sesudah ==="
          grep -nE "compileSdk" "$APP_GRADLE" || echo "(masih tidak ada baris compileSdk)"

          echo "✅ Selesai."

      # ==========================================================
      # 🩹 AUTO-FIX IMPORT 'package:http/http.dart'
      # ==========================================================
      # Error yang muncul:
      #   lib/dashboard_page.dart:124:36: Error: The getter 'http'
      #   isn't defined for the type '_DashboardPageState'.
      #
      # Penyebab: file .dart pakai http.post / http.get, tapi
      # tidak ada import 'package:http/http.dart' as http.
      # Step ini:
      # 1) Scan semua file .dart yang pakai `http.` tapi tidak import http
      # 2) Tambah import di baris pertama file tersebut
      # 3) Pastikan `http:` ada di pubspec.yaml
      # ==========================================================
      - name: Auto-fix missing http import
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          echo "=== Auto-fix missing 'http' import ==="

          if [ ! -d "lib" ]; then
            echo "ℹ️ Folder lib/ tidak ditemukan. Skip."
            exit 0
          fi

          # ---------- 1) Scan file .dart yang butuh import http ----------
          echo ""
          echo "=== Scan file .dart yang pakai http.* ==="

          mapfile -t HTTP_USERS < <(grep -RIlE '\bhttp\.(get|post|put|delete|patch|head|read|MultipartRequest)' \
            --include="*.dart" \
            lib 2>/dev/null || true)

          CLEAN_HTTP_USERS=()
          for f in "${HTTP_USERS[@]}"; do
            [ -n "$f" ] && CLEAN_HTTP_USERS+=("$f")
          done

          if [ "${#CLEAN_HTTP_USERS[@]}" -eq 0 ]; then
            echo "ℹ️ Tidak ada file .dart yang pakai http.*"
          else
            echo "📄 File yang pakai http.*: ${#CLEAN_HTTP_USERS[@]}"
            printf '   - %s\n' "${CLEAN_HTTP_USERS[@]}"

            for f in "${CLEAN_HTTP_USERS[@]}"; do
              # Cek apakah sudah import http
              if grep -qE "import[[:space:]]+['\"]package:http/http\.dart['\"]" "$f"; then
                echo "  ✅ Sudah import: $f"
                continue
              fi

              echo "  🔧 Tambah import: $f"
              # Sisipkan di baris pertama
              sed -i "1i import 'package:http/http.dart' as http;" "$f"
              # Tampilkan 5 baris pertama untuk konfirmasi
              echo "     --- 5 baris pertama ---"
              head -5 "$f" | sed 's/^/     /'
            done
          fi

          # ---------- 2) Pastikan http ada di pubspec.yaml ----------
          echo ""
          echo "=== Cek pubspec.yaml ==="

          if [ -f "pubspec.yaml" ]; then
            if grep -qE '^[[:space:]]+http[[:space:]]*:' pubspec.yaml; then
              echo "  ✅ http sudah terdaftar di pubspec.yaml"
            else
              echo "  🔧 Menambahkan http ke pubspec.yaml"
              # Sisipkan setelah baris 'dependencies:' pertama
              sed -i '/^dependencies:/a\  http: ^1.2.0' pubspec.yaml
              echo "     --- dependencies (5 baris pertama) ---"
              sed -n '/^dependencies:/,+5p' pubspec.yaml | sed 's/^/     /'
            fi
          else
            echo "  ⚠️ pubspec.yaml tidak ditemukan, skip."
          fi

          echo ""
          echo "=== Selesai auto-fix http ==="

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 1
      # ==========================================================
      - name: Analyze Project Code
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Starting Automated Code Analysis ==="

          if [ -f "pubspec.yaml" ]; then
            echo "🔍 Menjalankan linting via flutter analyze..."

            flutter analyze > analyze_report.txt 2>&1 || true

            echo "[RESULT_ANALYZE]"
            cat analyze_report.txt
            echo "[END_RESULT_ANALYZE]"

            rm -f analyze_report.txt

          else
            echo "☕ Project native / gradlew terdeteksi!"
            echo "[RESULT_ANALYZE]"
            echo "❌ Fitur analyze hanya support project Flutter (pubspec.yaml tidak ditemukan)."
            echo "[END_RESULT_ANALYZE]"
          fi

      # ==========================================================
      # 🔍 TAHAP ANALYZE — STEP 2
      # ==========================================================
      - name: Stop if Analyze Only
        if: ${{ github.event.inputs.only_analyze == 'true' }}
        run: |
          echo "Analyze-only mode aktif. Workflow dihentikan di sini."
          exit 0

      # =========================
      # FLUTTER DOCTOR
      # =========================
      - name: Flutter Doctor
        run: flutter doctor

      # ==========================================================
      # 📦 TAHAP DOWNLOAD DEPENDENSI (PUB GET)
      # ==========================================================
      - name: Get dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Running flutter pub get ==="
          if [ -f "pubspec.yaml" ]; then
            timeout 180s flutter pub get || echo "⚠️ Gagal download package karena network server, coba lanjut aja..."
          else
            echo "☕ Bukan project Flutter standar, skip pub get!"
          fi

      # ==========================================================
      # 🚀 TAHAP PEMBAKARAN UTAMA (BUILD APK)
      # ==========================================================
      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          echo "=== Building APK ==="
          echo "Mode: ${{ github.event.inputs.build_type }}"

          if [ -f "pubspec.yaml" ]; then
            echo "🔥 Project Flutter Terdeteksi! Kompilasi via Flutter SDK..."
            flutter build apk --${{ github.event.inputs.build_type }}
            
          else
            echo "☕ Project Native Android Terdeteksi! Bypassing Flutter Core..."
            GRADLE_PATH=$(find . -name "gradlew" | head -n 1)
            
            if [ -z "$GRADLE_PATH" ]; then
              echo "❌ ERROR: File 'gradlew' tidak ditemukan!"
              echo "FAILURE: Build failed with an exception"
              exit 1
            fi
            
            GRADLE_DIR=$(dirname "$GRADLE_PATH")
            cd "$GRADLE_DIR"
            chmod +x gradlew
            
            echo "🚀 Membakar APK menggunakan Gradle Native..."
            if [ "${{ github.event.inputs.build_type }}" = "debug" ]; then
              ./gradlew assembleDebug
            else
              ./gradlew assembleRelease
            fi
            cd -
          fi

      # =========================
      # CHECK APK
      # =========================
      - name: Check APK Output
        run: |
          echo "=== APK Output Scanning (Global Mode) ==="

          echo "Mencari file APK di seluruh direktori..."
          find $GITHUB_WORKSPACE -name "*.apk"

          APK_FOUND=$(find $GITHUB_WORKSPACE -name "*.apk" | head -n 1)

          if [ -z "$APK_FOUND" ]; then
            echo "Error: Berkas biner APK beneran gak dicetak sama sekali oleh compiler."
            exit 1
          fi

          APK_PATH=$(echo "$APK_FOUND" | sed "s|$GITHUB_WORKSPACE/||")

          echo "✅ APK Sukses Ditemukan di Jalur: $APK_PATH"
          
          echo "APK_PATH=$APK_PATH" >> $GITHUB_ENV

          echo ""
          echo "=== APK Size ==="
          ls -lh "$APK_FOUND"

      # =========================
      # UPLOAD APK
      # =========================
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: flutter-${{ github.event.inputs.build_type }}-${{ github.event.inputs.tag }}
          path: ${{ github.workspace }}/${{ env.APK_PATH }}
          retention-days: 1
          if-no-files-found: error